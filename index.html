<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flor Amarilla</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e293b, #0f172a);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 300px;
      height: 460px;
      display: flex;
      justify-content: center;
    }

    /* Flor completa */
    .flower {
      position: relative;
      width: 200px;
      height: 200px;
      animation: balanceo 4s ease-in-out infinite alternate;
      transform-origin: bottom center;
      z-index: 2;
    }

    /* Pétalos */
    .petal {
      position: absolute;
      width: 50px;
      height: 90px;
      background: linear-gradient(to top, #f59e0b, #fde047);
      border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
      top: 10px;
      left: 75px;
      transform-origin: bottom center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      filter: drop-shadow(0 0 3px rgba(234, 179, 8, 0.4));
    }

    /* Distribución circular perfecta de los pétalos */
    .p1  { transform: rotate(0deg) translateY(-28px); }
    .p2  { transform: rotate(30deg) translateY(-28px); }
    .p3  { transform: rotate(60deg) translateY(-28px); }
    .p4  { transform: rotate(90deg) translateY(-28px); }
    .p5  { transform: rotate(120deg) translateY(-28px); }
    .p6  { transform: rotate(150deg) translateY(-28px); }
    .p7  { transform: rotate(180deg) translateY(-28px); }
    .p8  { transform: rotate(210deg) translateY(-28px); }
    .p9  { transform: rotate(240deg) translateY(-28px); }
    .p10 { transform: rotate(270deg) translateY(-28px); }
    .p11 { transform: rotate(300deg) translateY(-28px); }
    .p12 { transform: rotate(330deg) translateY(-28px); }

    /* Centro de la flor */
    .center {
      position: absolute;
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #854d0e 25%, #713f12 60%, #3b1802 100%);
      border-radius: 50%;
      top: 65px;
      left: 65px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    /* Tallo */
    .stem {
      position: absolute;
      top: 170px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 220px;
      background: linear-gradient(to right, #15803d, #22c55e);
      border-radius: 4px;
      z-index: 1;
    }

    /* Hojas */
    .leaf {
      position: absolute;
      width: 50px;
      height: 28px;
      background: linear-gradient(to right, #16a34a, #4ade80);
      z-index: 1;
    }

    .leaf.left {
      top: 250px;
      left: 105px;
      border-radius: 0 100% 0 100%;
      transform: rotate(-25deg);
      box-shadow: -2px 2px 5px rgba(0,0,0,0.2);
    }

    .leaf.right {
      top: 290px;
      right: 105px;
      border-radius: 100% 0 100% 0;
      transform: rotate(25deg);
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    /* Animación suave de balanceo */
    @keyframes balanceo {
      0% {
        transform: rotate(-3deg);
      }
      100% {
        transform: rotate(3deg);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Cabeza de la flor -->
    <div class="flower">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
      <div class="petal p9"></div>
      <div class="petal p10"></div>
      <div class="petal p11"></div>
      <div class="petal p12"></div>
      
      <div class="center"></div>
    </div>

    <!-- Tallo y Hojas -->
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
  </div>

</body>
</html>
